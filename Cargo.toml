[package]
name = "ccline-statusline"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Claude Code status line: session cost that survives restarts, prompt-cache countdown, output speed, 5h/7d quota with this week's spend"
license = "MIT"
repository = "https://github.com/ncdeng/ccline-statusline"
readme = "README.md"
keywords = ["claude", "claude-code", "statusline"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1_smol = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
